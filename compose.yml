services:
  redis:
    image: redis:8.6.1-alpine
    container_name: training-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: training-app
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      MODEL_MANIFEST_PATH: configs/model_urls.json
      MODEL_ROOT_DIR: data/models/pretrained
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/models/pretrained:/app/data/models/pretrained
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./experiments:/app/experiments
      - /srv/shared:/srv/shared
    gpus: all
    shm_size: "16gb"
    command: bash startup.bash
    restart: unless-stopped

volumes:
  redis-data:
