# AutoResearch experiment loop defaults
# Budget, mutable HPO keys, and metric config.
# All values here can be overridden in job_config["experiment"].

experiment:
  max_trials: 20
  epochs_per_trial: 5       # validated: 3 was too few for LoRA convergence
  max_wall_time_seconds: null  # null = no wall-time limit
  metric_name: val_mAP50    # direct detection quality (not proxy loss)
  metric_mode: max           # "min" or "max"

# Keys the experiment loop is allowed to mutate.
# Schema: {dotted_key: {type: int|float|bool|choice|list, min?, max?, choices?, log_scale?}}
# Keys NOT listed here are immutable by default.
mutable_keys:
  # --- Shared training (teacher_training.yaml) ---
  "training.batch_size":          {type: int,    min: 1,    max: 32}
  "training.epochs":              {type: int,    min: 1,    max: 100}
  "training.optimizer":           {type: choice, choices: ["AdamW", "SGD"]}
  "training.weight_decay":        {type: float,  min: 0.0,  max: 0.1}
  "training.warmup_epochs":       {type: int,    min: 0,    max: 20}
  "training.warmup_ratio":        {type: float,  min: 0.0,  max: 1.0}

  # --- GroundingDINO LoRA ---
  "lora.r":                       {type: int,    min: 2,    max: 128}
  "lora.lora_alpha":              {type: int,    min: 4,    max: 256}
  "lora.lora_dropout":            {type: float,  min: 0.0,  max: 0.5}
  "lora.bias":                    {type: choice, choices: ["none", "all", "lora_only"]}
  "freeze_backbone":              {type: bool}
  "freeze_bbox_embed":            {type: bool}
  "learning_rate":                {type: float,  min: 1.0e-6, max: 1.0e-2, log_scale: true}
  "momentum":                     {type: float,  min: 0.8,  max: 0.99}

  # --- Training dynamics (training_dynamics.yaml) ---
  "training_dynamics.gradient_clipping.max_norm":   {type: float, min: 0.01, max: 10.0}
  "training_dynamics.gradient_clipping.enabled":    {type: bool}
  "training_dynamics.mixed_precision.enabled":      {type: bool}
  "training_dynamics.normalization.freeze_bn_teacher": {type: bool}

# Keys the experiment loop must NEVER mutate.
# Changing these would alter model identity or break dataset compatibility.
immutable_keys:
  - "model.base_checkpoint"
  - "model.config_path"
  - "bert_model_path"
  - "num_classes"
  - "class_names"
  - "class_mapping"
  - "model.name"
  - "checkpointing"
