[project]
name = "grounded-segment-anything"
version = "0.1.7"
description = "ML platform: Grounding DINO + SAM for auto-labeling, training, and inference"
requires-python = ">=3.10,<3.11"
dependencies = [
    # === PyTorch ecosystem ===
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchmetrics==1.8.2",

    # === ML / Training ===
    "peft>=0.18.0",
    "transformers>=4.40.0,<5.0.0",
    "timm>=1.0.0",
    "supervision>=0.26.0",
    "albumentations>=2.0.0",
    "ultralytics>=8.0.0",
    "iterative-stratification>=0.1.9",
    "tensorboard>=2.14.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "pycocotools>=2.0.0",

    # === GroundingDINO transitive deps ===
    "addict",
    "yapf",
    "termcolor",

    # === API / Server ===
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "redis>=7.0.0",

    # === LLM clients (Coordinator + experiment HPO) ===
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # === Data / IO ===
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "Pillow>=11.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.9.0",

    # === Source-installed packages ===
    "segment-anything",
    "groundingdino",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.0",
    "pre-commit>=3.6.0",
]
onnx = [
    "onnx>=1.14.0",
    "onnxruntime-gpu>=1.18.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-xdist",
    "mock>=5.1.0",
    "faker>=19.0.0",
    "hypothesis>=6.82.0",
    "fakeredis>=2.20.0",
]
lint = [
    "ruff",
    "mypy",
    # Type stubs for runtime deps that lack inline `py.typed` markers.
    # Adding only stubs that DROP the current mypy baseline; stubs for libs
    # that --ignore-missing-imports currently suppresses (PIL/tqdm/requests)
    # would surface previously-hidden errors and should ride with item 6's
    # broader cleanup, not this Step-1 quick-win PR.
    "types-PyYAML",
]
# Torch variant flag extras. Mutually exclusive — uv enforces via the
# `[tool.uv] conflicts` block below. One of these must be selected at
# `uv sync` time:
#   --extra cpu  →  CPU torch (CI, lint, laptop dev without GPU)
#   --extra gpu  →  CUDA 12.4 torch (training, inference, Dockerfile)
# The Makefile test/coverage targets already pass `--extra cpu` where
# appropriate.
cpu = [
    "torch",
    "torchvision",
]
gpu = [
    "torch",
    "torchvision",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "ml_engine*", "cli*", "augmentation*"]

# =============================================================================
# uv configuration
# =============================================================================

[tool.uv]
python-preference = "only-system"
# GroundingDINO needs torch at build time for CUDA extensions.
no-build-isolation-package = ["groundingdino"]

# The `cpu` and `gpu` extras below are mutually exclusive torch variants.
# Declaring the conflict here tells uv's resolver not to include both in
# the same resolution, which eliminates the "conflicting indexes" error
# that would otherwise appear when the same package (torch) is sourced
# from two different indexes.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

# Two torch indexes. Selection is driven by the `gpu` extra below.
# Default (no `gpu` extra) → CPU torch. Good for CI runners without GPUs
# and for machines where you just want fast, light installs.
# `--extra gpu` → CUDA 12.4 torch. Required for training, inference on GPU,
# and for the Dockerfile builder target (which compiles GroundingDINO's
# CUDA extension against CUDA torch).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# Mutually-exclusive torch variants, selected via the `cpu` or `gpu` extras.
# See [project.optional-dependencies] and [tool.uv].conflicts above for how
# the extras are declared and enforced. Linux-only marker on cu124 because
# PyTorch's CUDA 12.4 index doesn't ship Windows wheels, and this project
# only targets Linux.
torch = [
    { index = "pytorch-cu124", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu" },
]
segment-anything = { path = "deps/segment_anything", editable = true }
groundingdino = { path = "GroundingDINO", editable = true }

# =============================================================================
# Tool configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
# 110 chars: the previous 100 was borderline tight for an ML codebase where
# long type hints (Dict[str, Optional[List[ModelSpec]]]) and qualified
# parameter names routinely produce honest lines in the 101-110 range. 110
# leaves room for those without making 120-char wide lines acceptable. If
# this number drifts up further over time, that's a smell — fix the lines,
# don't keep raising the cap.
line-length = 110
# Vendored / third-party / research trees are not our lint scope. Our own
# code lives in api, core, ml_engine, augmentation, cli, tests.
extend-exclude = [
    # Vendored / submodule trees — not our code, not our discipline.
    "GroundingDINO",
    "deps",
    "EfficientSAM",
    "voxelnext_3d_box",
    "VISAM",            # Fork of MOTRv2 (MOT)
    "grounded-sam-osx", # Submodule for OSX 3D mesh recovery
    "playground",       # Upstream demo collection (DeepFloyd, ImageBind_SAM, LaMa, etc.)
    # Build outputs / runtime data
    "experiments",
    "assets",
    "logs",
    "output",
    ".venv",
    "build",
    "dist",
    # Jupyter notebooks aren't part of the lint-disciplined source tree —
    # they're research/exploration artifacts. Linting them produces noise
    # (cell-scoped imports trigger E402, redefinitions across cells trigger
    # F811) that doesn't reflect real code-quality concerns.
    "*.ipynb",
    # Upstream demo scripts at the repo root (from the original
    # IDEA-Research/Grounded-Segment-Anything tree). These are reference
    # examples that import GroundingDINO + segment_anything directly via
    # sys.path manipulation — not project code that uses our core/api/
    # ml_engine modules. Lint discipline is reserved for code we
    # actively maintain.
    "automatic_label_*.py",
    "grounded_sam_*.py",
    "grounding_dino_demo.py",
    "chatbot.py",
    "gradio_app.py",
    "predict.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# These test files have unused locals from scaffolded-but-not-finished test logic.
# Tracked in TODOS.md #29 for cleanup. F841 suppressed so ruff gates stay green.
"tests/unit/ml_engine/test_distillation_ros2_integration.py" = ["F841"]
"tests/unit/composer/test_registry.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
